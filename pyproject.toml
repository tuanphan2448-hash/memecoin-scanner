[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memecoin-scanner"
version = "0.1.0"
description = "Explainable memecoin discovery and public on-chain wallet risk scanner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
memecoin-scanner = "memecoin_scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/memecoin_scanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
